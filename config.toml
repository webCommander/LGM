baseURL = "http://localhost:1313/"
languageCode = "fr-fr"
title = "Les Grandes Marches"
theme = "gohugo-theme-ananke23"
defaultContentLanguage = "fr"

[permalinks]
posts = "/posts/:section/:slug/"

[frontmatter]
date = "date"

# Un simple retour à la ligne dans un article produit un saut de ligne au rendu
# (comportement attendu par les rédacteurs venant de Typora/WordPress)
[markup.goldmark.renderer]
hardWraps = true

# Le menu des voyages est généré depuis les sous-sections de content/blog.
