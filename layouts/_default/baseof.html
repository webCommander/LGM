<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

<head>
  {{ partial "head.html" . }}
</head>

<body>

  <!-- Hero (image en haut) -->
  {{ $hero := .Params.hero | default "/images/hero.jpg" }}
  <header
    class="hero"
    role="img"
    aria-label="{{ .Title }}">
    <div
      class="hero-image"
      data-image="{{ $hero }}"
      style="{{ printf "background-image: url('%s')" $hero | safeCSS }}">
    </div>
  </header>

  <div class="site-content">
    <!-- Menu principal -->
    <nav class="site-nav" aria-label="Navigation principale">
      <div class="site-nav-inner">
        <a href="/" class="site-brand">{{ .Site.Title }}</a>
        <ul class="site-menu">
          {{ range .Site.Menus.main }}
            <li>
              <a href="{{ .URL }}">{{ .Name }}</a>
            </li>
          {{ end }}
        </ul>
      </div>
    </nav>

    <!-- Contenu -->
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>

    <!-- Footer (du thème) -->
    <footer class="site-footer">
      <small>© {{ now.Year }} {{ .Site.Title }}</small>
    </footer>
  </div>

  {{ partial "scripts.html" . }}
</body>
</html>
