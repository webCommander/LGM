<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

<head>
  {{ partial "head.html" . }}
</head>

<body class="ma0 avenir bg-near-white">

  <!-- Hero (image en haut) -->
  {{ $hero := .Params.hero | default "/images/hero.jpg" }}
  <header
    class="hero"
    role="img"
    aria-label="{{ .Title }}">
    <div
      class="hero-image"
      data-image="{{ $hero }}"
      style="{{ printf "background-image: url('%s')" $hero | safeCSS }}">
    </div>
  </header>

  <div class="site-content">
    <!-- Menu principal -->
    <nav class="pa3 pa4-ns">
      <ul class="list flex justify-center pa0 ma0">
        {{ range .Site.Menus.main }}
          <li class="mh3 ici">
            <a href="{{ .URL }}" class="link dim dark-gray f4">{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>

    <!-- Contenu -->
    <main class="mw8 center ph3 pt4">
      {{ block "main" . }}{{ end }}
    </main>

    <!-- Footer (du thème) -->
    <footer class="pv4 ph3 ph5-m ph6-l mid-gray">
      <small>© {{ now.Year }} {{ .Site.Title }}</small>
    </footer>
  </div>

  {{ partial "scripts.html" . }}
</body>
</html>
