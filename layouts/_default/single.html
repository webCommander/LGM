{{ define "main" }}
<article class="article-page">

  <!-- Titre et date de l'article -->
  <header class="article-header">
    <p class="eyebrow">Journal de route</p>
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 January 2006" }}</time>
  </header>

  <!-- Galerie Lightbox : photos listées dans le front matter -->
  {{ $article := . }}
  {{ with .Params.photos }}
  <div class="article-gallery">
    {{ range . }}
      <a href="{{ partial "url.html" . }}" class="glightbox" data-gallery="article-gallery">
        <img src="{{ partial "url.html" . }}" alt="{{ $article.Title }}" loading="lazy" />
      </a>
    {{ end }}
  </div>
  {{ end }}

  <!-- Trace GPX de l'étape -->
  {{ with .Params.gpx }}
  <link rel="stylesheet" href="{{ "vendor/leaflet/leaflet.css" | relURL }}" />
  <div class="article-map">
    <div id="gpx-map" style="height: 380px; border-radius: 8px;"></div>
    <p id="gpx-meta"></p>
  </div>
  <script src="{{ "vendor/leaflet/leaflet.js" | relURL }}"></script>
  <script>
    (function () {
      var map = L.map('gpx-map', { scrollWheelZoom: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      fetch({{ partial "url.html" . }})
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          var xml = new DOMParser().parseFromString(txt, 'application/xml');
          var pts = Array.prototype.map.call(xml.querySelectorAll('trkpt, rtept'), function (p) {
            return [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))];
          });
          if (!pts.length) { return; }
          var line = L.polyline(pts, { color: '#c0392b', weight: 4 }).addTo(map);
          L.circleMarker(pts[0], { radius: 6, color: '#27ae60', fillOpacity: 1 }).addTo(map).bindTooltip('Départ');
          L.circleMarker(pts[pts.length - 1], { radius: 6, color: '#c0392b', fillOpacity: 1 }).addTo(map).bindTooltip('Arrivée');
          map.fitBounds(line.getBounds(), { padding: [20, 20] });
          var dist = 0;
          for (var i = 1; i < pts.length; i++) { dist += map.distance(pts[i - 1], pts[i]); }
          document.getElementById('gpx-meta').textContent = 'Distance de l’étape : ' + (dist / 1000).toFixed(1) + ' km';
        });
    })();
  </script>
  {{ end }}

<!-- GLightbox CSS & JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
  const lightbox = GLightbox({ selector: '.glightbox' });
</script>

  <!-- Contenu de l'article -->
  <div class="article-body">
    {{ .Content }}
  </div>

</article>

{{ end }}
