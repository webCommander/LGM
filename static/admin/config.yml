# Configuration de Sveltia CMS (interface d'administration sur /admin/)
# Documentation : https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: webCommander/LGM
  branch: main
  # Authentification via le fournisseur OAuth de Netlify
  base_url: https://api.netlify.com

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# Les slugs sont générés sans accents, comme les articles existants
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: "paris-ispahan"
    label: "Paris — Ispahan"
    label_singular: "article Paris — Ispahan"
    folder: "content/blog/paris-ispahan"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter: { field: "categories", value: "paris-ispahan" }
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Brouillon (ne pas publier sur le site)", name: "draft", widget: "boolean", default: false }
      - { label: "Catégories", name: "categories", widget: "hidden", default: ["paris-ispahan"] }
      - { label: "Texte de l'article", name: "body", widget: "markdown" }

  - name: "tour-des-zagoria"
    label: "Tour des Zagoria"
    label_singular: "article Tour des Zagoria"
    folder: "content/blog/tour-des-zagoria"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter: { field: "categories", value: "tour-des-zagoria" }
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Brouillon (ne pas publier sur le site)", name: "draft", widget: "boolean", default: false }
      - { label: "Catégories", name: "categories", widget: "hidden", default: ["tour-des-zagoria"] }
      - { label: "Texte de l'article", name: "body", widget: "markdown" }

  - name: "autre"
    label: "Autres articles"
    label_singular: "article"
    folder: "content/blog/autre"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter: { field: "categories", value: "autre" }
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Brouillon (ne pas publier sur le site)", name: "draft", widget: "boolean", default: false }
      - { label: "Catégories", name: "categories", widget: "hidden", default: ["autre"] }
      - { label: "Texte de l'article", name: "body", widget: "markdown" }
