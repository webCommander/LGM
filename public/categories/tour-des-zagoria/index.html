    .hero {

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-position: top center;
      background-size: cover;
      background-repeat: no-repeat;
      transform: translate3d(0, var(--hero-pan, 0), 0);
      will-change: transform;
    }

  <script>
  (() => {
    const hero = document.querySelector('.hero');
    const imageLayer = hero.querySelector('.hero-image');
    const image = new Image();
    let pan = 0;
    let targetPan = 0;
    let maxPan = 0;
    let frame;

    const render = () => {
      pan += (targetPan - pan) * 0.14;
      imageLayer.style.setProperty('--hero-pan', `${-pan}px`);

      if (Math.abs(targetPan - pan) > 0.1) {
        frame = requestAnimationFrame(render);
      } else {
        pan = targetPan;
        imageLayer.style.setProperty('--hero-pan', `${-pan}px`);
        frame = null;
      }
    };

    const startRender = () => {
      if (!frame) frame = requestAnimationFrame(render);
    };

    const measure = () => {
      if (!image.naturalWidth) return;

      const previousProgress = maxPan ? targetPan / maxPan : 0;
      const renderedHeight = Math.max(
        hero.clientHeight,
        hero.clientWidth * image.naturalHeight / image.naturalWidth
      );

      imageLayer.style.height = `${renderedHeight}px`;
      maxPan = renderedHeight - hero.clientHeight;
      targetPan = maxPan * previousProgress;
      pan = targetPan;
      imageLayer.style.setProperty('--hero-pan', `${-pan}px`);
    };

    const onWheel = (event) => {
      if (window.scrollY !== 0 || maxPan === 0) return;

      const movingDown = event.deltaY > 0 && (targetPan < maxPan || pan < maxPan - 0.5);
      const movingUp = event.deltaY < 0 && (targetPan > 0 || pan > 0.5);

      if (!movingDown && !movingUp) return;

      event.preventDefault();
      targetPan = Math.min(maxPan, Math.max(0, targetPan + event.deltaY));
      startRender();
    };

    image.addEventListener('load', measure);
    image.src = imageLayer.dataset.image;
    window.addEventListener('resize', measure);
    window.addEventListener('wheel', onWheel, { passive: false });
  })();
</script>
